[package]
name = "sessionize"
version = "0.1.0"
description = "Typed client for the Sessionize API"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagikazarmark/sessionize-rs"
keywords = ["sessionize", "conference", "schedule", "speakers", "api"]
categories = ["api-bindings", "web-programming::http-client"]

[features]
default = ["rustls"]
## HTTP client. Enable a TLS feature too (`rustls` or `native-tls`).
client = ["dep:futures-util", "dep:reqwest", "dep:serde_json", "dep:serde_path_to_error"]
## HTTP client using rustls.
rustls = ["client", "reqwest/rustls"]
## HTTP client using the platform's native TLS.
native-tls = ["client", "reqwest/native-tls"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
futures-util = { version = "0.3.34", default-features = false, optional = true }
reqwest = { version = "0.13.5", default-features = false, optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", optional = true }
serde_path_to_error = { version = "0.1.20", optional = true }
thiserror = "2.0.21"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"

[[example]]
name = "schedule"
required-features = ["client"]

[[example]]
name = "speakers"
required-features = ["client"]

[[example]]
name = "custom_fields"
required-features = ["client"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
